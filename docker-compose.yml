# Tacitly: human-defined vectors for thoughts and aspirations.
#   cp .env.example .env && docker compose up -d --build   -> http://<host>:8080

name: tacitly

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tacitly
      POSTGRES_USER: tacitly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacitly -d tacitly"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: tacitly:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${TACITLY_PORT:-8080}:8080"
    environment:
      Tacitly__ConnectionString: Host=db;Database=tacitly;Username=tacitly;Password=${POSTGRES_PASSWORD}
      Tacitly__AccessToken: ${TACITLY_TOKEN:-}
      Tacitly__Mind__HalfLifeDays: ${HALF_LIFE_DAYS:-30}
      Tacitly__Mind__StaleTodoDays: ${STALE_TODO_DAYS:-14}

volumes:
  db:
